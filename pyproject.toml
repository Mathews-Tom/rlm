[project]
name = "llm-recursive"
version = "0.1.0"
description = "A Python framework for building intelligent, recursive task decomposition systems powered by Large Language Models"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Tom Mathews", email = "tom@aetherforge.dev"}
]
maintainers = [
    {name = "Tom Mathews", email = "tom@aetherforge.dev"}
]
keywords = [
    "llm",
    "recursive",
    "task-decomposition",
    "agents",
    "multi-agent",
    "openai",
    "async",
    "orchestration",
    "ai",
    "nlp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Mathews-Tom/rlm"
Documentation = "https://github.com/Mathews-Tom/rlm#readme"
Repository = "https://github.com/Mathews-Tom/rlm"
Issues = "https://github.com/Mathews-Tom/rlm/issues"
Changelog = "https://github.com/Mathews-Tom/rlm/releases"

[project.optional-dependencies]
# L1 cache: In-memory LRU cache (zero dependencies, built into CachedAsyncEngine)
# No dependency group needed - uses stdlib OrderedDict

# L2 cache: Redis semantic similarity cache (lightweight with OpenAI embeddings)
cache-l2 = [
    "redis>=5.0.0",
    "redisvl>=0.3.0",
    # Uses OpenAI embeddings by default (API-based, no local model)
    # Requires OPENAI_API_KEY environment variable
    # Cost: ~$0.0001 per 1K tokens (text-embedding-3-small)
]

# L2 cache with HuggingFace/sentence-transformers (HEAVY ~500MB+)
# Only install if you need offline embeddings or don't want to use OpenAI API
cache-l2-local = [
    "redis>=5.0.0",
    "redisvl>=0.3.0",
    "sentence-transformers>=5.2.2",  # Pulls PyTorch/TensorFlow
]

# Legacy alias for backward compatibility (now uses OpenAI embeddings)
cache = [
    "redis>=5.0.0",
    "redisvl>=0.3.0",
]

observability = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlm"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "openai>=2.15.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "python-dotenv>=1.2.1",
    "ruff>=0.14.14",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
pythonPlatform = "All"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedVariable = true
reportOptionalMemberAccess = true
stubPath = "src"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require API keys, slower execution)",
    "benchmark: marks tests as performance benchmarks",
]
